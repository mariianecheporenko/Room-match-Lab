services:
  roommates_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: roommates_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"
    volumes:
      - roommates_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommates_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Room match Lab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=roommates_db;Port=5432;Database=roommates_db;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      roommates_db:
        condition: service_healthy

volumes:
  roommates_postgres_data:
