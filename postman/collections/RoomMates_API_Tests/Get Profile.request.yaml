$kind: http-request
url: "{{baseUrl}}/api/Profiles/{{profileId}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200 OK\", function () {\r

      \    pm.expect(pm.response.code).to.eql(200);\r

      });\r

      pm.test(\"ID matches saved profile\", function () {\r

      \    var data = pm.response.json();\r

      \    pm.expect(data.id).to.eql(pm.collectionVariables.get(\"profileId\"));\r

      });"
    language: text/javascript
order: 2000
