$kind: http-request
url: "{{baseUrl}}/api/Housings?skip=0&limit=5"
method: GET
queryParams:
  skip: "0"
  limit: "5"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200 OK\", function () {\r

      \    pm.expect(pm.response.code).to.eql(200);\r

      });\r

      pm.test(\"Response time is under 500ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(500);\r

      });\r

      pm.test(\"Returns paged structure with items array\", function () {\r

      \    var data = pm.response.json();\r

      \    pm.expect(data).to.have.property(\"totalCount\");\r

      \    pm.expect(data).to.have.property(\"items\");\r

      \    pm.expect(data.items).to.be.an(\"array\");})"
    language: text/javascript
order: 6000
