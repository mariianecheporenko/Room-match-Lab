services:
  roommates_db:
    image: postgres:16
    container_name: roommates_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roommates_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"
    volumes:
      - roommates_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommates_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roommates_postgres_data:
