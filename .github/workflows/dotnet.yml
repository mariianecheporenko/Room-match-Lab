name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "Room match Lab/tests/RoomMates.Tests/RoomMates.Tests.csproj"

    - name: Build solution
      run: dotnet build "Room match Lab/tests/RoomMates.Tests/RoomMates.Tests.csproj" --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test "Room match Lab/tests/RoomMates.Tests/RoomMates.Tests.csproj" --no-build -c Release --verbosity normal